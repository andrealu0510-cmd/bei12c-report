<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北一二C｜iPhone 18庫存查詢</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f8;color:#17303b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}.w{max-width:1000px;margin:auto;padding:24px}header{background:#fff;border-bottom:1px solid #dde5e8}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;max-width:1000px;margin:auto;font-weight:800}.tag{background:#17303b;color:#fff;padding:5px 9px;border-radius:8px}.date{font-size:13px;color:#657984}h1{font-size:36px;margin:20px 0 5px}.lead{color:#657984;margin:0 0 18px}.notice{background:#fff6e5;border:1px solid #ead8b4;color:#74531d;padding:10px 13px;border-radius:10px;margin-bottom:16px}.box,.card{background:#fff;border:1px solid #dce5e9;border-radius:15px}.box{padding:20px}label{font-weight:800;font-size:20px}input{width:100%;margin-top:8px;padding:14px;font-size:21px;border:2px solid #bdcdd4;border-radius:10px}.hint{font-size:13px;color:#657984;margin:7px 0 0}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px}.filters label{font-size:13px;color:#657984}.filters select{width:100%;margin-top:4px;padding:9px;border:1px solid #c8d5db;border-radius:9px;background:white}.quick{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}.quick button,.btn{border:1px solid #cbd7dc;background:white;border-radius:9px;padding:8px 10px;font-weight:700;cursor:pointer}.quick button{background:#fff1eb;color:#8a321f;border-color:#ecd0c6}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 10px}.bar h2{margin:0}.actions{display:flex;gap:7px}.btn.dark{background:#17303b;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.card{overflow:hidden}.head{padding:14px 16px;border-bottom:1px solid #e5ecef;display:flex;justify-content:space-between}.head h3{margin:0;font-size:22px}.color{color:#657984;font-size:14px}.total{color:#12644d;font-size:13px;font-weight:800}.row{display:flex;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #edf1f3;font-size:19px}.row:last-child{border:0}.qty{font-size:21px;font-weight:800}.meta{font-size:13px;color:#657984}.empty{grid-column:1/-1;text-align:center;padding:35px;background:white;border:1px dashed #b8c9d1;border-radius:14px;color:#657984}footer{font-size:12px;color:#657984;margin:24px 0}@media(max-width:650px){.w,.top{padding-left:15px;padding-right:15px}h1{font-size:29px}.filters,.grid{grid-template-columns:1fr 1fr}.actions{width:100%}.bar{flex-wrap:wrap}.actions .btn{flex:1}.grid{grid-template-columns:1fr}}
</style><header><div class="top"><div><span class="tag">N12C</span> 北一二C｜庫存查詢</div><span class="date">資料日 2026/09/20</span></div></header><main class="w"><h1>輸入機款，找到有貨店。</h1><p class="lead">型號、容量、顏色，不必再逐店翻表。</p><div class="notice">表內有貨 ≠ 可直接調撥；請先確認是否已售出、預約或保留。本頁不會自動扣庫存。</div><section class="box"><label for="q">你要找哪一款？</label><input id="q" type="search" placeholder="例如：Max 256 銀" autocomplete="off"><p class="hint">支援「Max256銀」「Pro 512 紅」「Max 256 藍或銀」。</p><div class="filters"><label>機型<select id="model"><option value="">全部</option><option value="Max">Pro Max</option><option value="Pro">Pro</option></select></label><label>容量<select id="cap"><option value="">全部</option><option>256G</option><option>512G</option><option>1TB</option><option>2TB</option></select></label><label>顏色<select id="color"><option value="">全部</option><option>冰川藍</option><option>勃根地紅</option><option>黑</option><option>銀</option></select></label><label>店點<select id="store"><option value="">全部</option></select></label></div><div class="quick"><button data-q="Max 256 藍或銀">東區需求｜Max 256 藍／銀</button><button data-q="Max 256 黑">後山需求｜Max 256 黑</button><button data-q="Max 512 黑">德東需求｜Max 512 黑</button></div></section><div class="bar"><div><h2 id="title">查詢結果</h2><div class="meta" id="meta"></div></div><div class="actions"><button class="btn dark" id="copy">複製群組文字</button><button class="btn" id="link">複製查詢連結</button><button class="btn" id="reset">清除</button></div></div><div id="results" class="grid"></div><footer>來源：本次提供的9店庫存表。空白視為0；未自行扣除調貨需求。查無結果代表本次表內未列有貨，不代表門市即時缺貨。版本 2026-09-20-01。</footer></main><script>
const D={stores:["士林夜市","天母德行東","台北公館","台北天母","台北忠孝東","台北東區","台北南京東","台北後山埤","台北新站前"],rows:[["Max","1TB","冰川藍",[0,0,0,0,0,1,0,0,0]],["Max","1TB","黑",[0,0,0,0,0,0,0,0,1]],["Max","256G","黑",[0,0,0,0,1,0,0,0,0]],["Max","256G","銀",[0,0,1,0,1,0,0,0,1]],["Max","2TB","冰川藍",[1,0,0,0,1,0,0,0,0]],["Max","512G","冰川藍",[0,0,0,1,0,0,0,1,0]],["Max","512G","勃根地紅",[0,0,1,0,0,0,0,0,0]],["Max","512G","黑",[0,0,0,2,0,0,0,0,1]],["Pro","1TB","黑",[0,0,0,0,0,1,0,0,0]],["Pro","256G","冰川藍",[1,1,0,1,2,0,1,0,0]],["Pro","256G","勃根地紅",[6,5,3,11,8,1,2,3,2]],["Pro","256G","黑",[3,1,0,1,1,0,0,0,1]],["Pro","256G","銀",[1,2,0,2,0,0,1,0,1]],["Pro","2TB","銀",[0,0,0,0,1,0,0,0,0]],["Pro","512G","冰川藍",[0,0,0,0,0,0,0,0,1]],["Pro","512G","勃根地紅",[0,2,0,2,3,0,0,2,2]],["Pro","512G","黑",[0,0,0,0,0,1,0,1,0]],["Pro","512G","銀",[0,0,0,1,0,1,0,0,0]]]};
const $=x=>document.getElementById(x), ids=["model","cap","color","store"];let cur=[];
D.stores.forEach(s=>$("store").insertAdjacentHTML("beforeend",'<option>'+s+'</option>'));
function parse(t){t=t.toLowerCase().replace(/iphone|apple|18|蘋果|5g/g," ");let model=/max|大pro/.test(t)?"Max":/pro|小pro/.test(t)?"Pro":"";let caps=(t.match(/256|512|1\s*t|2\s*t/g)||[]).map(x=>x.replace(/\s/g,"").replace("256","256G").replace("512","512G").toUpperCase());let colors=[];if(/冰川藍|藍|蓝|blue/.test(t))colors.push("冰川藍");if(/勃根地紅|柏根地紅|紅|红|red/.test(t))colors.push("勃根地紅");if(/黑|black/.test(t))colors.push("黑");if(/銀|银|silver/.test(t))colors.push("銀");return{model,caps,colors}}
function get(){let p=parse($("q").value);return D.rows.filter(r=>(!p.model||r[0]===p.model)&&(!p.caps.length||p.caps.includes(r[1]))&&(!p.colors.length||p.colors.includes(r[2]))&&(!$("model").value||r[0]===$("model").value)&&(!$("cap").value||r[1]===$("cap").value)&&(!$("color").value||r[2]===$("color").value)).map(r=>({r,ss:r[3].map((q,i)=>({q,n:D.stores[i]})).filter(x=>x.q>0&&(!$("store").value||x.n===$("store").value))})).filter(x=>x.ss.length)}
function state(){let p=new URLSearchParams;if($("q").value)p.set("q",$("q").value);ids.forEach(id=>{if($(id).value)p.set(id,$(id).value)});return p.toString()}
function render(save=true){cur=get();let stores=new Set(cur.flatMap(x=>x.ss.map(s=>s.n))).size,qty=cur.reduce((a,x)=>a+x.ss.reduce((b,s)=>b+s.q,0),0);$("title").textContent=cur.length?"找到 "+stores+" 家有貨店點":"本次表內未列有貨";$("meta").textContent=cur.length+" 種機款配色 · 表列 "+qty+" 支";$("copy").disabled=!cur.length;$("results").innerHTML=cur.length?cur.map(x=>'<article class="card"><div class="head"><div><h3>'+(x.r[0]==="Max"?"Pro Max":"Pro")+' '+x.r[1]+'</h3><div class="color">'+x.r[2]+'</div></div><span class="total">'+x.ss.reduce((a,s)=>a+s.q,0)+' 支 / '+x.ss.length+' 店</span></div>'+x.ss.map(s=>'<div class="row"><span>'+s.n+'</span><span class="qty">'+s.q+' 支</span></div>').join("")+'</article>').join(""):'<div class="empty"><h3>沒有符合條件的表列庫存</h3><p>可改查其他顏色、容量，或按「清除」查看全部。</p></div>';if(save)try{history.replaceState(null,"",location.pathname+(state()?"#"+state():""))}catch(e){}}
function reset(){ $("q").value="";ids.forEach(id=>$(id).value="");render()}
function txt(){return "📍北一二C｜庫存查詢\n資料日：2026/09/20\n查詢："+($("q").value||"篩選條件")+"\n\n"+cur.map(x=>"🔹 "+x.r[0]+"_"+x.r[1]+"-("+x.r[2]+")\n"+x.ss.map(s=>s.n+" × "+s.q).join("\n")).join("\n\n")+"\n\n※表列有貨不代表可調撥，請先確認。"}
async function cp(t){try{await navigator.clipboard.writeText(t);alert("已複製")}catch(e){prompt("請複製以下內容",t)}}
$("q").oninput=()=>render();ids.forEach(id=>$(id).onchange=()=>render());$("reset").onclick=reset;$("copy").onclick=()=>cp(txt());$("link").onclick=()=>cp(location.href);document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{reset();$("q").value=b.dataset.q;render()});let p=new URLSearchParams(location.hash.slice(1));$("q").value=p.get("q")||"";ids.forEach(id=>{let v=p.get(id)||"";if([...$(id).options].some(o=>o.value===v))$(id).value=v});render(false);
</script></html>
